    if (f.t <= 0) { f.t = 0.07; const s = sprite(fireTex, new THREE.Color().setHSL(rnd(0.03, 0.09), 1, 0.55), THREE.AdditiveBlending); s.position.set(f.x + rnd(-0.25, 0.25), 0.2, f.z + rnd(-0.25, 0.25)); s.scale.setScalar(0.6);
      fx.push({ o: s, life: rnd(0.5, 0.9), max: 0.9, v: new THREE.Vector3(rnd(-0.2, 0.2), rnd(1.2, 2), rnd(-0.2, 0.2)), kind: "fire", grow: rnd(0.4, 0.9), base: 0.5 }); } }
  if (st.state === "play") {
    flowT -= dt; if (flowT <= 0) { flowT = 0.35; updateFlow(); }
    const alive = zombies.filter(z => !z.dead).length;
    if (alive === 0 && st.toSpawn === 0) { st.waveT -= dt; if (st.waveT <= 0) { st.wave++; st.bossSpawned = false; st.toSpawn = 4 + st.wave * 3; st.spawnT = 0; st.waveT = 3; banner("Ondata " + st.wave); hud(); } }
    if (st.toSpawn > 0) { st.spawnT -= dt; if (st.spawnT <= 0) { st.spawnT = Math.max(0.35, 1.4 - st.wave * 0.1);
      let p = null; for (let k = 0; k < 80; k++) { const c = NAV.cells[Math.floor(Math.random() * NAV.cells.length)]; if (NAV.dist[c] > 14 && NAV.dist[c] < 1e8) { p = navPos(c); break; } }
      if (!p) p = navPos(NAV.cells[Math.floor(Math.random() * NAV.cells.length)]);
      const runChance = st.wave < 2 ? 0 : Math.min(0.45, 0.1 * (st.wave - 1));
      if (st.wave % 5 === 0 && !st.bossSpawned) { st.bossSpawned = true; makeZombie("walk", p, false, true); banner("Arriva il BOSS"); } else makeZombie(Math.random() < runChance ? "run" : "walk", p); st.toSpawn--; hud(); } }
  }
  for (let i = zombies.length - 1; i >= 0; i--) {
    const z = zombies[i], hz_ = z.holder;
    if (z.dead) { z.dead += dt;
      if (z.fling) { const f = z.fling; f.v.y -= 13 * dt; const np = hz_.position.clone().addScaledVector(f.v, dt), ny = np.y; moveOnMap(hz_.position, np); np.y = ny; hz_.position.copy(np);
        z.obj.rotation.x += f.sx * dt; z.obj.rotation.z += f.sz * dt;
        if (hz_.position.y <= 0 && f.v.y < 0) { hz_.position.y = 0; z.fling = null; z.obj.rotation.set(-1.5, 0, 0); z.landed = z.dead; burst(hz_.position.clone().setY(0.2), 0x5a4a3a, 6, 2, 0.2, 0.4); } }
      else if (!z.landed) { const u = Math.min(1, z.dead / 0.75), e = 1 - Math.pow(1 - u, 3) + Math.sin(u * Math.PI * 3) * 0.06 * (1 - u); z.obj.rotation.x = z.fallX * e; z.obj.rotation.z = z.fallZ * e; z.obj.position.y = -0.08 * e; }
      if (z.dead > 3.5 && !z.fling) hz_.position.y = -(z.dead - 3.5) * 0.45;
      if (z.dead > 5.5) { scene.remove(hz_); zombies.splice(i, 1); } continue; }
    z.mixer.update(dt);
    if (z.head && !z.headY) z.headY = z.head.getWorldPosition(new THREE.Vector3()).y;
    const to = st.pos.clone().sub(hz_.position); to.y = 0; const dist = to.length(); to.normalize();
    z.groan -= dt * (dist < 8 ? 1.6 : 1); if (z.groan <= 0) { z.groan = rnd(4, 10); if (dist < 22 && st.state === "play") sfx.groan(hz_.position.clone().setY(1.4), z.kind === "run"); }
    z.shuf = (z.shuf || rnd(0, 0.6)) - dt; if (z.shuf <= 0) { z.shuf = 0.55 / Math.max(0.6, z.speed); if (dist < 9 && st.state === "play") sfx.shuffle(hz_.position); }
    if (z.hitIn > 0) { z.hitIn -= dt; if (z.hitIn <= 0 && dist < 1.5 * z.scale && st.state === "play") hurt(z.boss ? 30 : z.kind === "run" ? 10 : 14, hz_.position.clone()); }
    if (st.state === "play" && dist < 1.15 * z.scale) { z.atk -= dt; z.lunge = Math.min(1, z.lunge + dt * 4); if (z.atk <= 0) { z.atk = z.boss ? 1.5 : 1.1; z.swipe = 1; z.hitIn = 0.3; sfx.snarl(hz_.position.clone().setY(1.4)); } }
    else { z.lunge = Math.max(0, z.lunge - dt * 3); z.atk = Math.min(z.atk, 0.35);
      if (st.state === "play" || st.state === "dead") {
        const dir = flowDir(hz_.position); z.face = dir;
        const np = hz_.position.clone().addScaledVector(dir, z.speed * dt * (st.state === "dead" ? 0.3 : 1));
        for (const o of zombies) { if (o === z || o.dead) continue; const dx = np.x - o.holder.position.x, dz = np.z - o.holder.position.z, d = Math.hypot(dx, dz); if (d < 0.6 && d > 1e-4) { np.x += dx / d * (0.6 - d) * 0.5; np.z += dz / d * (0.6 - d) * 0.5; } }
        moveOnMap(hz_.position, np); hz_.position.copy(np);
      } }
    { const fd = dist < 2.5 || !z.face ? to : z.face; const ty = Math.atan2(fd.x, fd.z); let dy = ty - hz_.rotation.y; dy = Math.atan2(Math.sin(dy), Math.cos(dy)); hz_.rotation.y += dy * Math.min(1, dt * 8); } z.flinch = (z.flinch || 0) * Math.exp(-dt * 7); z.obj.rotation.x = z.lunge * 0.25 - z.flinch * 0.3;
    if (z.swipe > 0) { z.swipe = Math.max(0, z.swipe - dt / 0.65); const u = 1 - z.swipe, a = u < 0.4 ? -1.1 * Math.sin(u / 0.4 * Math.PI / 2) : u < 0.65 ? -1.1 + 1.6 * ((u - 0.4) / 0.25) : 0.5 * (1 - (u - 0.65) / 0.35);
      const ax = new THREE.Vector3(Math.cos(hz_.rotation.y), 0, -Math.sin(hz_.rotation.y)); for (const b of z.arms) rotWorld(b, ax, a); }
    if (z.headSnap > 0.01 && z.head) { z.headSnap *= Math.exp(-dt * 6); rotWorld(z.head, new THREE.Vector3(Math.cos(hz_.rotation.y), 0, -Math.sin(hz_.rotation.y)), -0.7 * z.headSnap); }
  }
  for (const c of cover) { c.mixer.update(dt); c.holder.position.x += dt * 0.35; if (c.holder.position.x > c.home + 2.5) c.holder.position.x = c.home - 1; }
  for (let i = pickups.length - 1; i >= 0; i--) { const k = pickups[i]; k.t += dt; k.m.rotation.y += dt * 2; k.m.position.y = 0.6 + Math.sin(k.t * 3) * 0.1;
    if (k.m.position.distanceTo(st.pos.clone().setY(0.6)) < 1.0 && st.state === "play") { collectPickup(k); scene.remove(k.m); pickups.splice(i, 1); } else if (k.t > (k.type === "beer" ? 60 : 30)) { scene.remove(k.m); pickups.splice(i, 1); } if (k.ring) k.ring.material.opacity = 0.35 + 0.25 * Math.sin(k.t * 5); }
  updateFx(dt);
  animate(st);
  sun.position.copy(st.pos).addScaledVector(SUN_DIR, 60); sun.target.position.copy(st.pos); roomLight.position.copy(st.pos).add(new THREE.Vector3(0, 2.2, 0));
  embers.rotation.y += dt * 0.02; embers.position.y = (st.t * 0.3) % 2 - 1;
}
setInterval(() => musicTick(), 200);
renderer.setAnimationLoop(() => { const dt = Math.min(clock.getDelta(), 0.05); if (st.state !== "pause") step(dt); renderer.render(scene, camera); });
}
